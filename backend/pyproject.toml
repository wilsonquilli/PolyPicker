[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polypicker"
version = "0.1.0"
description = "PolyPicker backend: NBA data ingestion, prediction models and read-only API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "polars>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "nba_api>=1.12",
    "nflreadpy>=0.1.5",
    "pillow>=10.4",       # club logos -> small WebP files for the web app
    "pypdf>=5.0",         # official NBA injury report (league PDF)
    "requests>=2.31",     # HTTP for the market / injury feeds (also pulled in by nba_api)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
clubelo = ["soccerdata>=2026.43"]   # Club Elo reader (`polypicker soccer clubelo`); heavy (selenium), so optional

[project.scripts]
polypicker = "polypicker.cli:app"

[tool.setuptools.packages.find]
include = ["polypicker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need a running PostgreSQL (skipped if unavailable)"]
